name: Daily central harness audit
on:
  schedule:
    - cron: "0 0 * * *" # 09:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile automation scripts and parse example evaluation cases
        run: |
          python3 -m py_compile scripts/*.py
          python3 -c "import json; d=json.load(open('evals/cases/observed_patterns.json', encoding='utf-8')); assert d['status']=='design_only_not_executed' and len(d['cases']) >= 3"
      - name: Run collector self-tests and synthetic contract reproductions
        run: |
          python3 scripts/private_evidence_audit.py --self-test
          python3 scripts/test_contract_reproductions.py
          python3 scripts/scheduled_private_evidence.py --self-test
      - name: Validate nine archived originals, links and skill metadata
        run: python3 scripts/validate_harness.py --mode central --output harness-validation.json
      - name: Store central validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-harness-validation
          path: harness-validation.json
          if-no-files-found: warn
          retention-days: 30
